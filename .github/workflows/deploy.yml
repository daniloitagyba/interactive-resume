name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  APP_DIR: interactive-resume
  APP_NAME: interactive-resume
  APP_PORT: "3001"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          : "${VPS_HOST:?Missing VPS_HOST repository variable or secret}"
          : "${VPS_USER:?Missing VPS_USER repository variable or secret}"

          printf "Host %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  ProxyCommand cloudflared access ssh --hostname %%h\n" "$VPS_HOST" "$VPS_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}

      - name: Prepare remote directory
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p ~/${APP_DIR}/dist"
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}

      - name: Deploy build via rsync
        run: |
          rsync -az --delete dist/ "$VPS_USER@$VPS_HOST:~/${APP_DIR}/dist/"
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}

      - name: Restart app with PM2
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s << REMOTE
            export NVM_DIR="\$HOME/.nvm"
            [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
            nvm use default > /dev/null

            APP_DIR="\$HOME/${APP_DIR}"
            APP_NAME="${APP_NAME}"
            APP_PORT="${APP_PORT}"

            if pm2 describe "\$APP_NAME" > /dev/null 2>&1; then
              pm2 restart "\$APP_NAME"
            else
              pm2 serve "\$APP_DIR/dist" "\$APP_PORT" --name "\$APP_NAME" --spa
            fi

            pm2 save
          REMOTE
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
