name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host ${{ secrets.VPS_HOST }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null" > ~/.ssh/config

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_DIR="$HOME/interactive-resume"
            APP_NAME="interactive-resume"
            APP_PORT=3001

            # Clone if first deploy, otherwise pull
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/daniloitagyba/interactive-resume.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull origin main

            npm install --production=false
            npm run build

            # Restart or start PM2 process
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart "$APP_NAME"
            else
              pm2 start "npx serve -s dist -l $APP_PORT" --name "$APP_NAME"
              pm2 save
            fi
          DEPLOY
